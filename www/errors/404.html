<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Webserv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #ff4444;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        .code {
            font-size: 120px;
            font-weight: bold;
            opacity: 0.15;
            line-height: 1;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .path {
            background: #111;
            border: 1px solid #333;
            padding: 10px 24px;
            border-radius: 4px;
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        a {
            color: #ff4444;
            text-decoration: none;
            border-bottom: 1px solid #ff4444;
            font-size: 13px;
        }

        .footer {
            margin-top: 60px;
            color: #222;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="code">404</div>
        <div class="icon">🔍</div>
        <h1>NOT FOUND</h1>
        <p class="subtitle">The resource you requested does not exist</p>
        <div class="path">The requested URL was not found on this server</div>
        <a href="/">← Back to Home</a>
        <div class="footer">HTTP/1.1 404 Not Found</div>
    </div>
</body>

</html>
