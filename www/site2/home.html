<!DOCTYPE html>
<html>
<head>
    <title>Server 2 - 9090</title>
    <style>body{background:#1a1a2e;color:#fff;font-family:sans-serif;padding:40px;} .box{background:#16213e;padding:20px;border-radius:8px;} button{padding:10px;background:#e94560;color:#fff;border:none;cursor:pointer;}</style>
</head>
<body>
    <h1>Welcome to Site 2 (Port 9090)</h1>
    <p>This server allows POST methods, uploads, and redirects.</p>
    
    <div class="box">
        <h3>Test File Upload</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" required>
            <button type="submit">Upload via POST</button>
        </form>
        <p id="status"></p>
    </div>
    
    <br>
    <a href="/redirect" style="color:#e94560;">Test 301 Redirect (to example.com)</a>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('fileInput').files[0];
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                document.getElementById('status').innerText = 'Response Status: ' + response.status;
            } catch (err) {
                document.getElementById('status').innerText = 'Upload failed: ' + err;
            }
        });
    </script>
</body>
</html>
