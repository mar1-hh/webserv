<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>405 Method Not Allowed | Webserv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #ffaa00;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        .code {
            font-size: 120px;
            font-weight: bold;
            opacity: 0.15;
            line-height: 1;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .methods {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .method {
            border: 1px solid #333;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
        }

        .method.allowed {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        a {
            color: #ffaa00;
            text-decoration: none;
            border-bottom: 1px solid #ffaa00;
            font-size: 13px;
        }

        .footer {
            margin-top: 60px;
            color: #222;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="code">405</div>
        <div class="icon">🚫</div>
        <h1>METHOD NOT ALLOWED</h1>
        <p class="subtitle">This route does not support the used HTTP method</p>
        <div class="methods">
            <span class="method allowed">GET</span>
            <span class="method">POST</span>
            <span class="method">DELETE</span>
        </div>
        <a href="/">← Back to Home</a>
        <div class="footer">HTTP/1.1 405 Method Not Allowed</div>
    </div>
</body>

</html>
