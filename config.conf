server {
    host 0.0.0.0;
    listen 8080;
    root ./www/site1;
    client_max_body_size 1000000;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        methods GET;
        index index.html;
    }

    location /list {
        directory_listing on;
    }
    location /images {
        methods GET;
        root ./www/site1/images;
        autoindex on;
    }
    location /home {
        index index.html
    }
}

server {
    host 127.0.0.1;
    listen 9090;
    root ./www/site2;
    client_max_body_size 2000000;

    location /home {
        index index.html
    }
    location / {
        methods GET POST;
        index home.html;
    }

    location /upload {
        methods POST;
        upload_enable on;
        upload_path ./uploads;
    }
    

    location /list {
        directory_listing on;
    }

    location /redirect {
        return 301 http://example.com;
    }
}