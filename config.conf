server {
    host 0.0.0.0;
    listen 8080;
    root ./www/site1;
    max_body_size 10000;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        methods GET;
        index index.html;
    }
    location /uploads {
        methods  GET POST DELETE;
        upload on ./uploads ;
    }

    location /list {
        directory_listing on;
    }
    location /images {
        methods GET;
        root ./www/site1/images;
        autoindex on;
    }
    location /home {
        index index.html;
    }
    location /redirect {
        redirection http://example.com;
    }
    location /cgi-bin {
        methods GET POST;
        root ./www/site1/cgi-bin;
        cgi .py /usr/bin/python3;
    }
}

server {
    host 127.0.0.1;
    listen 9090;
    root ./www/site2;
    max_body_size 2000000;

    location /home {
        index home.html;
    }
    location / {
        methods GET POST;
        index home.html;
    }

    location /home {
        methods GET POST;
        index home.html;
    }

    location /uploads {
        methods GET DELETE POST;
        upload on ./uploads ;
    }
    

    location /list {
        directory_listing on;
    }

    location /redirect {
        redirection  http://example.com;
    }
}